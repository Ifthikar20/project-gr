name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gamekit-tests:
    name: GameKitCore tests (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # xcodebuild against the simulator: package targets import UIKit/SwiftUI,
      # so a plain macOS-host `swift test` would not compile them.
      - name: Run tests
        working-directory: Packages/GemRunCore
        run: |
          xcodebuild test \
            -scheme GemRunCore-Package \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            | xcbeautify --renderer github-actions || \
          xcodebuild test \
            -scheme GemRunCore-Package \
            -destination 'platform=iOS Simulator,name=iPhone 15'

  app-build:
    name: Full app build (iOS Simulator)
    # macos-15: current XcodeGen emits the Xcode 16 project format (77),
    # which the macos-14 default Xcode 15.4 cannot open.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      # CODE_SIGNING_ALLOWED=NO: simulator build, no signing — so the
      # HealthKit / Sign in with Apple entitlements can't block CI.
      - name: Build GemRun
        run: |
          xcodebuild build \
            -project GemRun.xcodeproj \
            -scheme GemRun \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  backend-tests:
    name: Django API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py test
