# XcodeGen manifest — run `xcodegen` to (re)generate GemRun.xcodeproj
name: GemRun
options:
  bundleIdPrefix: com.gemrun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GemRunCore:
    path: Packages/GemRunCore
  GemRunFeatures:
    path: Packages/GemRunFeatures

targets:
  GemRun:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: targeted
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        DEVELOPMENT_TEAM: 6SP7VHC6XC
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: App/GemRun.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Sign in with Apple ships in the UI, but the entitlement is kept
        # DISABLED here: a free personal team can't provision it, so enabling
        # it fails `./run.sh device` ("provisioning profile doesn't support
        # the Sign in with Apple capability"). Re-enable the line below when
        # you enrol in the paid Apple Developer Program — that's also when you
        # can actually submit, and when App Store Guideline 4.8's working-SIWA
        # requirement kicks in. Xcode Automatic signing adds it to the profile
        # once the paid team qualifies. Until then, use guest sign-in in dev.
        # com.apple.developer.applesignin: [Default]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RunnerCard
        # Version shown in Settings > About: marketing version + build
        # number. Xcode substitutes these at build time; run.sh passes
        # CURRENT_PROJECT_VERSION = git commit count, so every build's
        # number is higher than the last.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Launch: paper background + the card-and-bolt mark, so the first
        # frame already looks like RunnerCard instead of a bare white sheet.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: BrandMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: >-
          RunnerCard uses your location while the map is open and during
          runs to measure the distance you cover inside zones — on a run
          that works with the screen off, phone in your pocket. We never
          track you outside the map or a run.
        UIBackgroundModes: [location]
        NSHealthUpdateUsageDescription: >-
          RunnerCard saves your finished runs and walks to Health as workouts.
        NSHealthShareUsageDescription: >-
          RunnerCard reads your step count to show accurate stats for each
          finished run.
        NSMotionUsageDescription: >-
          RunnerCard uses your step data during a run so distance and steps
          only count when you're actually moving — not from GPS drift.
        CFBundleURLTypes:
          - CFBundleURLName: com.gemrun.app
            CFBundleURLSchemes: [gemrun]
        # Dev only: allows plain-HTTP calls to the local Django backend.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # iOS's Local Network privacy prompt (separate from ATS): required
        # for the phone to reach the Mac's LAN IP during development.
        NSLocalNetworkUsageDescription: >-
          RunnerCard connects to your development server on this network to
          load zones and routes.
        # Backend base URL. Debug builds get this from Configs/DevAPI.xcconfig
        # (script-written LAN IP). Empty = env-var fallback / mock.
        GemRunAPIBaseURL: $(GEMRUN_API_URL)
    dependencies:
      - package: GemRunCore
        products: [CoreModels, DesignSystem, CoreMap, CoreNetworking, CorePersistence, CoreLocationKit, CoreAuth]
      - package: GemRunFeatures
        products:
          - FeatureOnboarding
          - FeatureExplore
          - FeatureRouteCreation
          - FeatureActiveRun
          - FeatureStash
          - FeatureCompete
          - FeatureProfile
