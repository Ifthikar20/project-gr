# XcodeGen manifest — run `xcodegen` to (re)generate GemRun.xcodeproj
name: GemRun
options:
  bundleIdPrefix: com.gemrun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GemRunCore:
    path: Packages/GemRunCore
  GemRunFeatures:
    path: Packages/GemRunFeatures

targets:
  GemRun:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: targeted
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        DEVELOPMENT_TEAM: 6SP7VHC6XC
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: App/GemRun.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Sign in with Apple requires a paid Apple Developer Program membership;
        # personal (free) teams can't provision it. Add back when we go paid:
        # com.apple.developer.applesignin: [Default]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GemRun
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: >-
          GemRun uses your location during runs to confirm you passed each gem.
          While-using only — we never track you outside a run.
        UIBackgroundModes: [location]
        NSHealthUpdateUsageDescription: >-
          GemRun saves your finished runs and walks to Health as workouts.
        NSHealthShareUsageDescription: >-
          GemRun reads your total walking and running distance to turn the
          kilometers you've run into gems you can drop for other runners.
        NSMotionUsageDescription: >-
          GemRun uses your step data during a run so distance and steps only
          count when you're actually moving — not from GPS drift.
        CFBundleURLTypes:
          - CFBundleURLName: com.gemrun.app
            CFBundleURLSchemes: [gemrun]
        # Dev only: allows plain-HTTP calls to the local Django backend.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # iOS's Local Network privacy prompt (separate from ATS): required
        # for the phone to reach the Mac's LAN IP during development.
        NSLocalNetworkUsageDescription: >-
          GemRun connects to your development server on this network to
          load gems and routes.
        # Backend base URL. Debug builds get this from Configs/DevAPI.xcconfig
        # (script-written LAN IP). Empty = env-var fallback / mock.
        GemRunAPIBaseURL: $(GEMRUN_API_URL)
    dependencies:
      - package: GemRunCore
        products: [CoreModels, DesignSystem, CoreMap, CorePersistence, CoreLocationKit]
      - package: GemRunFeatures
        products:
          - FeatureOnboarding
          - FeatureExplore
          - FeatureRouteCreation
          - FeatureActiveRun
          - FeatureStash
          - FeatureCompete
          - FeatureProfile
